name: Automated CI Quality & PR Verification Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-checks:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Automated Vitest Regression & Core Suites
      run: npm run test:ci

    - name: Verify Next.js Production Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://atmatooytieelwiarffp.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ijcWQyHGOSuCilaFvt1r0w' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_ijcWQyHGOSuCilaFvt1r0w' }}

    - name: Audit Secret & Key Exposure
      run: |
        echo "Running security check for exposed secrets..."
        ! grep -rn "sk_live_" app/ components/ api/ lib/ || exit 1
